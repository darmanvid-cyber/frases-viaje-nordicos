function shrink(file){

    im.onload=()=>{const k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?ok(b):ko(new Error("img")),"image/jpeg",.9)};

function chunks(text,max){

  text.split(/\n+/).forEach(l=>{l=l.trim();if(!l)return;if(cur&&(cur+"\n"+l).length>max){out.push(cur);cur=""}cur=cur?cur+"\n"+l:l;while(cur.length>max){out.push(cur.slice(0,max));cur=cur.slice(max)}});

}
async function tradG(text,from,to){to=to||"es";
  const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+encodeURIComponent(from==="Autodetect"?"auto":from)+"&tl="+to+"&q="+encodeURIComponent(text));
  if(!r.ok)throw new Error("tr");

}
async function tradM(text,from,to){to=to||"es";
  const parts=chunks(text,450),res=[];
  for(const t of parts){
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(t)+"&langpair="+encodeURIComponent(from+"|"+to));
    const j=await r.json();
    if(!j.responseData||j.responseStatus&&Number(j.responseStatus)!==200)throw new Error("tr");

}
async function trad(text,from,to){

}

<script>(function(){

  try{cur=localStorage.getItem(KEY)}catch(e){}
  if(cur!=="dark"&&cur!=="light")cur=mq&&mq.matches?"dark":"light";
  function apply(){
    root.setAttribute("data-theme",cur);
    btn.textContent=cur==="dark"?"Modo claro":"Modo oscuro";
    btn.setAttribute("aria-label",cur==="dark"?"Cambiar a modo claro":"Cambiar a modo oscuro");
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",cur==="dark"?"#0b1626":"#f1f5fa");
  }
  btn.onclick=function(){cur=cur==="dark"?"light":"dark";try{localStorage.setItem(KEY,cur)}catch(e){}apply()};
  apply();
})();</script>
